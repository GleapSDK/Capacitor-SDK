# The pre-publish checks of release.yml, without publishing.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tsc + rollup + docgen. `npm run lint` is not run: eslint/prettier fail on
      # main today (pre-existing), and verify:ios/verify:android need native toolchains.
      - name: Build
        run: npm run build

      - name: Pack (dry run)
        run: npm pack --dry-run
